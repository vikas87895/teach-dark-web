<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Style Study</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>APNA_STYLE<small>&nbsp;// STUDY.SYS</small></div>
  <nav>
    <a href="index.html">source.load</a>
    <a href="gallery.html" class="active">apna style study</a>
  </nav>
</div>

<div class="container">
  <div class="hero">
    <h1>Apna Style Study</h1>
    <p>Tumhari saari recorded lectures yahan hain. Title aur description daal ke inhe organize karo.</p>
  </div>

  <div id="videoGrid" class="grid"></div>
  <div id="emptyState" class="empty" style="display:none;">Abhi koi recording nahi hai. Teach mode me jaake ek lecture record karo.</div>
</div>

<!-- edit modal -->
<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center;">
  <div class="panel" style="width:min(480px,90vw);">
    <h3 style="margin-top:0; font-family:var(--disp);">Video Details</h3>
    <div class="field">
      <label>Title</label>
      <input type="text" id="titleInput" placeholder="e.g. Electrostatics — Gauss Law Part 1">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="descInput" rows="4" placeholder="Chapter, topic, JEE relevance..."></textarea>
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn small" id="cancelEdit">Cancel</button>
      <button class="btn solid small" id="saveEdit">Save</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
